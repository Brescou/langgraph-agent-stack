# Dependabot — automated dependency update PRs
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Covers:
#   - uv / pyproject.toml + uv.lock (grouped PRs)
#   - GitHub Actions workflows (.github/workflows/)
#   - Docker base images (infra/Dockerfile)
#   - Docker Compose images (redis, prometheus, grafana in infra/)

version: 2
updates:
  # ── Python (uv lockfile) ───────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      langchain-ecosystem:
        patterns:
          - langchain*
          - langgraph*
          - langsmith*
      # Minor and patch only. A major lands as its own PR instead of riding
      # along in the group: #148 grouped four majors (fastapi 0.141, mcp 2.x,
      # redis 8, anthropic 1.x) and three of them broke the build
      # independently, which made the single PR unmergeable and unbisectable
      # without pinning packages back one at a time.
      python-app:
        patterns:
          - "*"
        exclude-patterns:
          - langchain*
          - langgraph*
          - langsmith*
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # ── Docker (python:3.12.x-slim builder + runtime stages) ─────────────────
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      docker-base-images:
        patterns:
          - "*"

  # ── Docker Compose (redis, prometheus, grafana) ──────────────────────────
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      compose-images:
        patterns:
          - "*"
