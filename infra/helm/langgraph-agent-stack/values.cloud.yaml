# Cloud overlay — used by Terraform (EKS/GKE/AKS). Not for kind/minikube.
# Tag omitted on purpose: deployment template falls back to .Chart.AppVersion
# (immutable once the matching v* image is published). Do not set tag: latest.
#
# FORKS: this points at the upstream template's registry. If you forked this
# repo, override it or you will deploy upstream's image instead of your own:
#   - Terraform: -var="image_repository=ghcr.io/<you>/langgraph-agent-stack"
#   - Helm:      --set image.repository=ghcr.io/<you>/langgraph-agent-stack
image:
  repository: ghcr.io/brescou/langgraph-agent-stack
  pullPolicy: IfNotPresent
